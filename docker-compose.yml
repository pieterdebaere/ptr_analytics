services:
  analytics:
    build: .
    # image: ghcr.io/pieterdebaere/ptr_analytics:latest
    container_name: ptr-analytics
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - analytics-data:/data
    # Only expose to localhost; put a TLS-terminating reverse proxy (Caddy, nginx,
    # Traefik) in front of it. See README → Deployment.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  analytics-data:
